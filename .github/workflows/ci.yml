name: CI

# Verifies the declared runtime floor actually holds. `engines.node` is
# ">=18.0.0" across the root and every workspace package, but nothing was
# proving the suite runs on anything other than the release build's Node 22.
# This matrix runs the full build + test suite on the engines floor (18), the
# current LTS many users are on (20), and the build version (22) so a
# Node-version regression is caught on push/PR instead of at a user's install.

on:
  push:
    branches: [KodaX, InfX]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build:packages

      - name: Test
        run: npm test
